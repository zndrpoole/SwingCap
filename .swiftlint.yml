included:
  - SwingCap
  - SwingCapTests

excluded:
  - SwingCap/Detection/Models

disabled_rules:
  - trailing_whitespace       # handled by editor
  - todo                      # TODOs are tracked in TODO.md, not linted

opt_in_rules:
  - array_init
  - closure_spacing
  - contains_over_filter_count
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 60
  error: 100

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - pb
    - sb
    - fd
    - x
    - y
    - i

type_name:
  excluded:
    - _PreviewUIView
    - _PlayerUIView
