name: SwingCap
options:
  bundleIdPrefix: com.swingcap
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_PREVIEWS: YES

targets:
  SwingCap:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: SwingCap/Resources/Info.plist
    sources:
      - path: SwingCap
        excludes:
          - Resources/Info.plist
    resources:
      - SwingCap/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swingcap.app
        PRODUCT_NAME: SwingCap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""             # Set your team ID here
        CODE_SIGN_STYLE: Automatic

  SwingCapTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SwingCapTests
        optional: true
    dependencies:
      - target: SwingCap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swingcap.tests
